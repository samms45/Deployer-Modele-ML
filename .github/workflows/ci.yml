name: Python CI/CD

on:
  push:
    branches: [ "brouillon", "main" ]
  pull_request:
    branches: [ "brouillon", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rh_prediction_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sam
          # POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Pro : met en cache les dépendances pour aller plus vite

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest-cov httpx python-dotenv

    - name: Lancer les tests avec Rapport de Couverture
      env:
        # On utilise le mot de passe "sam" comme dans la partie services
        DATABASE_URL: postgresql://postgres:sam@localhost:5432/rh_prediction_db
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        API_KEY: ${{ secrets.API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # 1. On ajoute le dossier src au chemin de recherche
        export PYTHONPATH=$PYTHONPATH:./src
        
        # 2. On lance l'initialisation (on pointe bien sur src.db_config)
        python -c "from src.db_config import engine; from src.db_models import Base; Base.metadata.create_all(bind=engine)"
        
        # 3. On lance pytest sur tout le projet
        pytest --cov=. --cov-report=term-missing

    - name: Déploiement sur Hugging Face
      if: github.event_name == 'push' && github.ref == 'refs/heads/brouillon'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        git push --force https://samss1010:$HF_TOKEN@huggingface.co/spaces/samss1010/api-prediction-rh brouillon:main