name: Python CI

on:
  push:
    branches: [ "brouillon" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # On ajoute un service PostgreSQL pour le robot
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rh_prediction_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install httpx pytest-cov python-dotenv

    - name: Lancer les tests
      env:
        DATABASE_URL: postgresql://postgres:sam@localhost:5432/rh_prediction_db
        SECRET_KEY: "12345"
        API_KEY: "mon_badge_secret_987"
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        # AJOUT : On crée les tables dans la DB de GitHub avant de lancer pytest
        python -c "from db_config import engine; from db_models import Base; Base.metadata.create_all(bind=engine)"
        pytest