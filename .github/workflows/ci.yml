name: Python CI/CD

on:
  push:
    branches: [ "brouillon", "main" ]
  pull_request:
    branches: [ "brouillon", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rh_prediction_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Pro : met en cache les dépendances pour aller plus vite

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest-cov httpx python-dotenv

    - name: Lancer les tests avec Rapport de Couverture
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        API_KEY: ${{ secrets.API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        # Initialisation auto de la structure DB
        python -c "from db_config import engine; from db_models import Base; Base.metadata.create_all(bind=engine)"
        # Pytest avec coverage détaillé
        pytest --cov=. --cov-report=term-missing --cov-fail-under=90

    - name: Déploiement sur Hugging Face
      if: github.event_name == 'push' && github.ref == 'refs/heads/brouillon'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        git push --force https://samss1010:$HF_TOKEN@huggingface.co/spaces/samss1010/api-prediction-rh brouillon:main