name: Python CI/CD

on:
  push:
    branches: [ "brouillon", "main" ]
  pull_request:
    branches: [ "brouillon", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rh_prediction_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sam
          # POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Pro : met en cache les dépendances pour aller plus vite

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest-cov httpx python-dotenv
        

    - name: Lancer les tests avec Rapport de Couverture
      env:
        DATABASE_URL: postgresql://postgres:sam@localhost:5432/rh_prediction_db
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        API_KEY: ${{ secrets.API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # 1. On pointe sur le dossier exact qui contient tes scripts
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src/api
        
        # 2. Initialisation de la DB (maintenant il trouvera db_config directement)
        python -c "from db_config import engine; from db_models import Base; Base.metadata.create_all(bind=engine)"
        
        # 3. ON LANCE LES TESTS
        # .         -> cherche les fichiers test_*.py partout (donc dans /tests)
        # --cov=src/api -> calcule le score uniquement pour ton code source
        pytest . --cov=src/api --cov-report=term-missing


    - name: Push to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # 1. Configuration Git
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        
        # 2. Installation et initialisation de Git LFS (crucial pour ton .joblib)
        git lfs install
        
        # 3. On s'assure que le fichier est bien suivi par LFS
        git lfs track "src/api/model_final_reg.joblib"
        
        # 4. Le push vers Hugging Face
        git push --force https://samss1010:$HF_TOKEN@huggingface.co/spaces/samss1010/api-prediction-rh brouillon:main